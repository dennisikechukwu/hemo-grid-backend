# Runtime defaults; every secret and deployment-specific address is supplied by environment.

spring:
  application:
    name: hemogrid

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hemogrid}
    username: ${DB_USERNAME:hemogrid}
    password: ${DB_PASSWORD:hemogrid}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render supplies PORT; SERVER_PORT remains available for local overrides.
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:hemogrid-api}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
